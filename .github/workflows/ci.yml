name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-ut:
    name: Backend UT (JaCoCo 80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # TODO(coverage): カバレッジ 80% 到達後 -Pno-coverage-check を外す
      - name: Maven test (UT) + JaCoCo check
        run: mvn -B test -Pno-coverage-check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: apps/backend/target/site/jacoco/

  backend-it:
    name: Backend IT (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # TODO(coverage): カバレッジ 80% 到達後 -Pno-coverage-check を外す
      - name: Maven verify (UT + IT)
        run: mvn -B verify -Dskip.unit.tests=false -Pno-coverage-check

  frontend-ut:
    name: Frontend UT (Vitest 80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # TODO(coverage): カバレッジ 80% 到達後 NO_COVERAGE_CHECK を外す
      - run: npm run test:coverage
        env:
          NO_COVERAGE_CHECK: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/

  browser-it:
    name: Browser IT (Playwright)
    runs-on: ubuntu-latest
    # 公式 Playwright image にはブラウザ・OS 依存・Node 22 が同梱済みで、
    # `playwright install --with-deps` の 12 分超を丸ごと省ける。
    # Playwright バージョン更新時はこの tag も合わせて上げること。
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    needs: [backend-it, frontend-ut]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  # ST はリリース前に手動実行（workflow_dispatch）。
  # scripts/st/ 配下の半自動スクリプト実行は実外部サービス接続が必要なためここでは雛形のみ。
  st:
    name: System Test (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: echo "ST is run manually via workflow_dispatch (see scripts/st/)"

  # main への push でテスト全緑後、GHCR に backend / web イメージを push する。
  # 自宅サーバーは deployment/deploy.sh で `docker compose pull && up -d` するだけで更新できる。
  build-and-push:
    name: Build & Push images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-ut, backend-it, frontend-ut, browser-it]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: build/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/keitan339/raditomo-backend:latest
            ghcr.io/keitan339/raditomo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push web
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          file: build/web/Dockerfile
          # nginx テンプレートを名前付きコンテキストで渡す（Buildx の機能）
          build-contexts: |
            nginx-templates=build/web/templates
          push: true
          tags: |
            ghcr.io/keitan339/raditomo-web:latest
            ghcr.io/keitan339/raditomo-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
