name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-ut:
    name: Backend UT (JaCoCo 80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven test (UT) + JaCoCo check
        run: mvn -B test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: apps/backend/target/site/jacoco/

  backend-it:
    name: Backend IT (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (UT + IT)
        run: mvn -B verify -Dskip.unit.tests=false

  frontend-ut:
    name: Frontend UT (Vitest 80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/

  browser-it:
    name: Browser IT (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-it, frontend-ut]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Start IT compose
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.test.yml up -d
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  # ST はリリース前に手動実行（workflow_dispatch）。
  # scripts/st/ 配下の半自動スクリプト実行は実外部サービス接続が必要なためここでは雛形のみ。
  st:
    name: System Test (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: echo "ST is run manually via workflow_dispatch (see scripts/st/)"
