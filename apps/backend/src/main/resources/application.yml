spring:
  application:
    name: raditomo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/radiko}
    username: ${SPRING_DATASOURCE_USERNAME:radiko}
    password: ${SPRING_DATASOURCE_PASSWORD:radiko}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    time-zone: Asia/Tokyo

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  file:
    path: ${LOG_BASE_PATH:./logs}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

raditomo:
  recordings-base-path: ${RECORDINGS_BASE_PATH:./data/recordings}
  xml-base-path: ${XML_BASE_PATH:./data/xml}
  notification:
    enabled: ${NOTIFICATION_ENABLED:true}
    from: ${NOTIFICATION_FROM:${SMTP_USERNAME:noreply@example.com}}
    subject-prefix: "[Raditomo]"
  jwt:
    secret: ${JWT_SECRET:dev_secret_please_change_in_production_must_be_256bit_or_longer}
    expiration-hours: 24
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
      authorization-uri: ${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwks-uri: ${GOOGLE_OAUTH_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuer: ${GOOGLE_OAUTH_ISSUER:https://accounts.google.com}
  radiko:
    download-concurrency: ${RADIKO_DOWNLOAD_CONCURRENCY:8}
    base-url: ${RADIKO_BASE_URL:https://radiko.jp}
    # rec_radiko_ts と互換のデバイスレベル共通鍵。失効時は更新が必要。
    auth-key: ${RADIKO_AUTH_KEY:bcd151073c03b352e1ef2fd66c32209da9ca0afa}
    auth-cache-hours: ${RADIKO_AUTH_CACHE_HOURS:3}
    http-connect-timeout-seconds: 10
    http-read-timeout-seconds: 30
    chunk-retry: 3
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    timezone: Asia/Tokyo

---
# DevContainer 用ローカル開発プロファイル。
# 起動: mvn -Dspring-boot.run.profiles=local spring-boot:run
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://db:5432/radiko_dev
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        format_sql: true

raditomo:
  scheduler:
    enabled: false  # 5:30 cron はローカルでは止める
  notification:
    enabled: false  # SMTP 設定なしで起動できるように

logging:
  level:
    com.raditomo: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.raditomo: INFO
