services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radiko_test
      POSTGRES_USER: radiko
      POSTGRES_PASSWORD: test
      TZ: Asia/Tokyo
    ports:
      - "15432:5432"

  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "18080:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "loginPagePath": null,
          "tokenCallbacks": []
        }
